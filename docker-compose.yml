# ============================================================
# OpenBusinessOS — Docker Compose (Local Development)
# ============================================================
# Compatible with Docker Desktop on Windows.
# Usage: docker compose up -d
# ============================================================

services:
  # --- PostgreSQL 16 ---
  postgres:
    image: postgres:16-alpine
    container_name: obos-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: openbusinessos
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - obos-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d openbusinessos"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- Redis 7 ---
  redis:
    image: redis:7-alpine
    container_name: obos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    networks:
      - obos-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # --- MinIO (S3-compatible) ---
  minio:
    image: minio/minio:latest
    container_name: obos-minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console
    environment:
      MINIO_ROOT_USER: minio123
      MINIO_ROOT_PASSWORD: minio123
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    networks:
      - obos-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  obos-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  miniodata:
    driver: local
