# ============================================================
# OpenBusinessOS — Docker Compose (Full Stack)
# ============================================================
# Usage: docker compose up -d
# API: http://localhost:3001/api/v1/docs
# Web: http://localhost:3000
# MinIO Console: http://localhost:9001
# ============================================================

services:
  # --- PostgreSQL 16 ---
  postgres:
    image: postgres:16-alpine
    container_name: obos-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: businessos
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - obos-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d businessos"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- Redis 7 ---
  redis:
    image: redis:7-alpine
    container_name: obos-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    networks:
      - obos-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # --- MinIO (S3-compatible) ---
  minio:
    image: minio/minio:latest
    container_name: obos-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio123
      MINIO_ROOT_PASSWORD: minio123
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    networks:
      - obos-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- API (NestJS) ---
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: obos-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/businessos
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-me-in-production-use-random-string
      JWT_EXPIRES_IN: 24h
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - obos-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3001/api/v1/docs-json || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # --- Web (Next.js) ---
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
    container_name: obos-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      NEXTAUTH_SECRET: a8ce570cb108f5ed8a845fbb1caf4f2273b1b59839d51b22388ef76d77efdce4
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_API_URL_INTERNAL: http://api:3001/api/v1
    depends_on:
      - api
    networks:
      - obos-network

networks:
  obos-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  miniodata:
    driver: local
